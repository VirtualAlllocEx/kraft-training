[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Decap CMS admin panel — trailing slash for trailingSlash: 'always'
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# 404 fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Cache exercise images with revalidation (filenames are not content-hashed,
# so they must not be immutable)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"

# Cache Astro built assets (hashed filenames)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"

# HTML pages: always revalidate with the origin so a fresh publish is
# visible on the first reload.
[[headers]]
  for = "/kategorie/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/plan/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/uebung/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/hilfe/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/offline/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Branding icons
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icon-*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Shared client helpers (plan storage)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Service worker: must never be cached so new versions roll out immediately
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Security headers (public site) — must come BEFORE the /admin/* block below.
# Netlify merges [[headers]] blocks that both match a URL, and later blocks
# override earlier ones for the same header key. So the more specific
# /admin/* block MUST be last to win.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate"
    Referrer-Policy = "no-referrer"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # identity.netlify.com: invite/recovery widget on public pages.
    # api.netlify.com: Identity API calls from that widget.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://identity.netlify.com https://api.netlify.com; frame-src 'self' https://identity.netlify.com; object-src 'none'; base-uri 'self'; form-action 'self' https://identity.netlify.com; frame-ancestors 'none'"

# Admin panel (Decap CMS) — needs 'unsafe-eval'. Local patched bundle only
# (no unpkg). This block is LAST so its CSP overrides the global /* CSP above.
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' blob: https://identity.netlify.com https://api.netlify.com https://www.netlifystatus.com https://*.netlify.com https://*.netlify.app; frame-src 'self' https://identity.netlify.com; object-src 'none'; base-uri 'self'; form-action 'self' https://identity.netlify.com; frame-ancestors 'self'"
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), fullscreen=(self)"
